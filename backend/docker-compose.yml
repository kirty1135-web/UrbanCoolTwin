version: '3.8'
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: urbancool
      POSTGRES_PASSWORD: urbancoolpassword
      POSTGRES_DB: urbancool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbancool -d urbancool"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
